{% extends "base.html" %}

{% block title %}Search Results{% endblock %}

{% block content %}
<h1>Search Results</h1>
<ul>
    {% for user in users %}
    <li>
        <h3>{{ user.name }}</h3>
        <a
            href="{{ url_for('main.view_user_wishlists', user_id=user.id) }}">View
            Wishlists</a>
    </li>
    {% endfor %}
</ul>

<a href="{{ url_for('main.profile') }}">Back to Profile</a>
{% endblock %}
