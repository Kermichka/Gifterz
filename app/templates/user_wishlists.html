{% extends "base.html" %}

{% block title %}{{ user.name }}'s Wishlists{% endblock %}

{% block content %}

<h2>{{ user.name }}'s Wishlists</h2>

{% for wishlist in wishlists %}
<div>
    <h3>{{ wishlist.title }}</h3>
    <a
        href="{{ url_for('main.view_user_wishlist_post', user_id=user.id, list_id=wishlist.id) }}">View
        Presents</a>
</div>
{% endfor %}
{% endblock %}
